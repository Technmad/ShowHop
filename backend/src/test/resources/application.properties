# Tests run against H2 in PostgreSQL-compatibility mode so the same Flyway
# migrations that run against real PostgreSQL also run in the test suite.
spring.datasource.url=jdbc:h2:mem:showhop-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Wide enough for the concurrent-purchase test, which deliberately opens
# more simultaneous transactions than the JDBC default pool size.
spring.datasource.hikari.maximum-pool-size=25

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Never actually contacted in tests: SecurityMockMvcRequestPostProcessors.jwt()
# injects a pre-built Authentication directly and never calls JwtDecoder.decode().
# The property just needs to exist so the JwtDecoder bean gets created --
# jwk-set-uri (unlike issuer-uri) does that lazily, with no network I/O at
# context-startup time.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/showhop/protocol/openid-connect/certs

# Every WebhookFanOutService/WebhookDeliveryWorker call in the test suite is
# explicit and direct (unit tests, or the dedicated Postgres IT). Without
# this, @EnableScheduling would make every @SpringBootTest that loads the
# full context also fire background fan-out/delivery ticks against whatever
# fake endpoint URLs that test's fixtures happen to contain.
showhop.webhooks.scheduling-enabled=false

# RazorpayOrderClient/RazorpayRefundClient are mocked or backed by
# MockRestServiceServer in every test that touches them -- these values are
# never used to make a real call, they just need to exist so
# RazorpayProperties binds to something non-null (e.g. razorpayKeyId in a
# reservation response).
showhop.razorpay.key-id=rzp_test_fake_key
showhop.razorpay.key-secret=rzp_test_fake_secret
showhop.razorpay.webhook-secret=whsec_test_fake_secret

# Same reasoning as showhop.webhooks.scheduling-enabled above: every
# ReservationReaper call in the test suite is explicit and direct, so a
# @SpringBootTest never expires a reservation the test is still asserting on.
showhop.reservations.scheduling-enabled=false

# Actuator's management port autoconfiguration binds a real socket even for
# MOCK-webEnvironment tests. A fixed port would collide if two test contexts
# are ever alive at once; 0 picks a free ephemeral port per context instead.
management.server.port=0
