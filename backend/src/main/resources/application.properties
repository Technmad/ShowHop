spring.application.name=showhop-api

# Database connection (local docker-compose Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=changeme-local-only

# Flyway owns the schema; Hibernate only validates entity mappings against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Keycloak (local docker-compose realm). jwk-set-uri, not issuer-uri: the
# issuer-uri path does an eager OIDC-discovery network call when the
# JwtDecoder bean is created, which would make every Spring context that
# loads this config (including plain context-load tests) depend on
# Keycloak being reachable. jwk-set-uri only fetches keys lazily, on the
# first real token verification.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/showhop/protocol/openid-connect/certs

# Actuator lives on its own port, deliberately outside SecurityConfig's JWT
# filter chain -- ops/scraping traffic (health probes, Prometheus) has no
# Keycloak token to present, and gating it behind a new role would be
# scope creep for what's meant to be an internal-network-only surface.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Every request/RestClient/... span this app emits, sampled -- traffic is
# nowhere near a volume where sampling matters yet. Spans render to the
# application log (see TracingConfig) since no collector runs locally; set
# management.otlp.tracing.endpoint to point at a real one (Tempo/Jaeger/etc.)
# in a real deployment -- Spring Boot autoconfigures an OTLP exporter the
# moment that property is set, no code change needed.
management.tracing.sampling.probability=1.0
# management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
